# Dev environment and tasks. `mise install` sets up the tools; `mise tasks` lists the tasks.
# System packages (GPU, windowing, mpv, ffmpeg, Docker) still come from the OS; see docs/PLAN.md §7.
#
# Tasks are one command each, because mise runs them through cmd.exe on Windows: shell steps go
# in a script under dev/ or packaging/, and the scripts run from Git Bash (or WSL/Linux).

[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }
# `python`, on every OS: Windows has no `python3` (its `python3.exe` is a Microsoft Store stub).
python = "3.13"
# Builds the Linux .deb (packaging/package.sh).
"cargo:cargo-deb" = { version = "3.8.0", os = ["linux"] }
# GitHub CLI, for the ci:* tasks.
gh = "2.102.0"

[env]
RUST_LOG = "info"

# App

[tasks.run]
description = "Run the app (debug build)"
run = "cargo run -p tabbyfin"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.check]
description = "Lint like CI: clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Format the workspace (CI checks it)"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting like CI"
run = "cargo fmt --all --check"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.ci]
description = "What CI runs on every push"
depends = ["fmt:check", "check", "test"]

[tasks.smoke]
description = "Exercise the Jellyfin API client against the dev server"
run = "cargo run -p jellyfin --example smoke"

# Dev server (dev/README.md)

[tasks."dev:media"]
description = "Generate the synthetic test library (needs ffmpeg)"
run = "bash dev/make-media.sh"

[tasks."dev:up"]
description = "Start the Jellyfin dev server on http://localhost:8096"
depends = ["dev:media"]
run = "docker compose -f dev/compose.yaml up -d"

[tasks."dev:setup"]
description = "Start the dev server, run the startup wizard and scan libraries (idempotent)"
depends = ["dev:up"]
run = "python -I dev/setup-server.py"

[tasks."dev:min"]
description = "Start and set up the minimum-version (10.11) server on http://localhost:8097, then run the smoke test against it"
depends = ["dev:media"]
run = "bash dev/dev.sh min"

[tasks."dev:down"]
description = "Stop the dev servers"
run = "docker compose -f dev/compose.yaml --profile min down"

[tasks."dev:reset"]
description = "Delete the dev server's config and cache (keeps the media), then set it up again"
run = "bash dev/dev.sh reset"

# Windows only: the app loads libmpv and ANGLE from next to its own exe.
[tasks."dev:assets"]
description = "Put libmpv and ANGLE beside the built exe in target/, so playback runs on Windows"
run = "bash dev/win-assets.sh"

# Packaging (packaging/package.sh)

[tasks.package]
description = "Release build and package for a target (default: x86_64-unknown-linux-gnu; use x86_64-pc-windows-msvc on Windows)"
usage = 'arg "[target]" default="x86_64-unknown-linux-gnu"'
run = [
  "cargo build --release --locked -p tabbyfin --target {{arg(name='target')}}",
  "bash packaging/package.sh {{arg(name='target')}} dist",
]

[tasks."package:appimage"]
description = "Build the Linux AppImage in an Ubuntu 22.04 container, so it runs on older distributions too"
run = "bash packaging/appimage-docker.sh dist"

[tasks."package:flatpak"]
description = "Build the Flatpak bundle (needs flatpak and flatpak-builder; Linux only)"
run = "bash packaging/flatpak/build.sh dist"

[tasks."deps:mirror"]
description = "Upload the pinned downloads (packaging/*.lock) to the repo's deps release, after changing a lock file"
run = "bash packaging/mirror-deps.sh"

[tasks."flatpak:sources"]
description = "Regenerate the Flatpak's cargo-sources.json after Cargo.lock changes"
run = "bash packaging/flatpak/update-cargo-sources.sh"

# CI (GitHub Actions)

[tasks."ci:build"]
description = "Build packages for every OS on GitHub Actions and download them into dist/"
run = "bash packaging/ci-build.sh"

[tasks."ci:status"]
description = "Show recent CI runs"
run = "gh run list --workflow ci.yml --limit 10"
