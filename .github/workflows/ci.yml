name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libssl-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The API client against real servers: the newest we develop against and the oldest we
  # support, set up like the dev servers (dev/README.md) with the same synthetic media.
  integration:
    name: Integration (Jellyfin ${{ matrix.jellyfin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ["12.2", "10.11.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration
      - name: Cache the test media
        id: media
        uses: actions/cache@v4
        with:
          path: dev/.data/media
          key: dev-media-${{ hashFiles('dev/make-media.sh') }}
      - name: Generate the test media
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          dev/make-media.sh
      - name: Start Jellyfin
        # As the runner's user, like the dev compose file, so the bind mounts stay writable.
        run: |
          mkdir -p dev/.data/config dev/.data/cache
          docker run -d --name jellyfin --user "$(id -u):$(id -g)" -p 8096:8096 \
            -v "$PWD/dev/.data/config:/config" -v "$PWD/dev/.data/cache:/cache" \
            -v "$PWD/dev/.data/media:/media:ro" \
            jellyfin/jellyfin:${{ matrix.jellyfin }}
      - name: Set up the server
        timeout-minutes: 10
        run: python3 -I dev/setup-server.py
      - name: Smoke test
        run: cargo run -p jellyfin --example smoke
      - name: Websocket check
        run: cargo run -p jellyfin --example socket
      - name: Server log
        if: failure()
        run: docker logs jellyfin

  package:
    name: Package (${{ matrix.target }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libmpv2
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup --version 6.7.1 --no-progress -y
      - run: cargo build --release --locked -p jelly-gpui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: jelly-gpui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Package (AppImage)
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in Ubuntu 22.04
        run: packaging/appimage-docker.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: jelly-gpui-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Release
    needs: [package, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
