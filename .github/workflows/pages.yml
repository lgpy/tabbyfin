name: Website

# Publishes site/ to GitHub Pages (https://tabbyfin.lgpy.dev/). The site is plain files
# with no build step, so the folder is uploaded as it is. Pages has to be set to deploy from
# GitHub Actions once (Settings → Pages → Source). The custom domain lives in that same
# settings page, because a deployment from Actions ignores a CNAME file.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer one doesn't cancel the one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
