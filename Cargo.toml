[workspace]
resolver = "3"
members = ["crates/jellyfin", "crates/player", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lgpy/tabbyfin"
publish = false

[workspace.dependencies]
jellyfin = { path = "crates/jellyfin" }
player = { path = "crates/player" }

# The UI. egui, eframe and egui-wgpu are released together; bump them together, along with
# egui_material_icons (built for one egui version).
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
egui_material_icons = { version = "0.9", features = ["filled", "outline"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
# The session websocket, upgraded through reqwest so it shares its TLS setup.
reqwest-websocket = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
url = "2"

directories = "6"
gethostname = "1"
keyring = "4"
toml = "1"
uuid = { version = "1", features = ["v4"] }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
