[workspace]
resolver = "3"
members = ["crates/jellyfin", "crates/player", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lgpy/jelly-gpui"
publish = false

[workspace.dependencies]
jellyfin = { path = "crates/jellyfin" }
player = { path = "crates/player" }

# gpui-kit pins and re-exports its exact GPUI snapshot. Never depend on `gpui` directly.
# Bump deliberately, in its own commit, after reading the gpui-kit changelog.
gpui-kit = "=0.7.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
url = "2"

directories = "6"
gethostname = "1"
keyring = "4"
toml = "1"
uuid = { version = "1", features = ["v4"] }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# GPUI crates patched for in-app video; see third_party/gpui/PATCHES.md.
[patch.crates-io]
gpui-pre = { path = "third_party/gpui/gpui-pre" }
gpui-pre-windows = { path = "third_party/gpui/gpui-pre-windows" }
gpui-pre-wgpu = { path = "third_party/gpui/gpui-pre-wgpu" }
