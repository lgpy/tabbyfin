[package]
name = "cast"
description = "CASTV2 (Chromecast) sender and the Jellyfin receiver's message contract (no UI dependencies)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-util", "net", "sync"] }
# ring, never aws-lc-rs: a C/CMake build is painful to cross-compile for Android (docs/chromecast.md).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mdns-sd = "0.21"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The fake device's self-signed certificate, only with the `fake-device` feature.
rcgen = { version = "0.14", default-features = false, features = ["ring"], optional = true }

[features]
# Compiles the scripted device from `src/fake.rs` into the library, for the app's UI tests.
fake-device = ["dep:rcgen"]

[dev-dependencies]
# A dev-dependency on itself, so `cargo test` builds the library with `fake-device` for the
# integration tests.
cast = { path = ".", features = ["fake-device"] }
anyhow.workspace = true
jellyfin.workspace = true
tracing-subscriber.workspace = true
