[package]
name = "player"
description = "mpv playback embedded through libmpv (no UI dependencies)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# libmpv is loaded at runtime, so building doesn't need it installed.
libloading = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The player host process talks over pipes (`process`, `io-*`).
tokio = { workspace = true, features = ["rt", "sync", "process", "io-util", "io-std"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# GPU video output (OpenGL <-> D3D11 interop), also used by examples/dx_interop_probe.rs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
# ANGLE (libEGL.dll), loaded at runtime for the zero-copy video path.
khronos-egl = { version = "6", features = ["dynamic"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Passing the shared video memory fds from the player host process (SCM_RIGHTS).
rustix = { version = "1", features = ["net", "fs"] }
# GPU video output (Vulkan external memory <-> OpenGL), also used by
# examples/vk_interop_probe.rs. Same versions wgpu uses.
ash = { version = "0.38", features = ["loaded"] }
khronos-egl = { version = "6", features = ["dynamic"] }
