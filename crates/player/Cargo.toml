[package]
name = "player"
description = "mpv playback embedded through libmpv (no UI dependencies)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# libmpv is loaded at runtime, so building doesn't need it installed.
libloading = "0.8"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
