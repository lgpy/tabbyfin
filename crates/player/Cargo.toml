[package]
name = "player"
description = "mpv control over JSON IPC (no UI dependencies)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# In-window video through libmpv's software renderer (PLAN §5.4 option C, experimental).
# libmpv is loaded at runtime, so building doesn't need it installed.
software-render = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
