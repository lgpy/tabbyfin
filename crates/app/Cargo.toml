[package]
name = "jelly-gpui"
description = "Desktop Jellyfin client built with GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jellyfin.workspace = true
player = { workspace = true, features = ["libmpv"] }
gpui-kit.workspace = true

anyhow.workspace = true
directories.workspace = true
gethostname.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Video frames are handed to GPUI as RenderImages.
image = { version = "0.25", default-features = false }
smallvec = "1"

# Debug builds of gpui-kit's icons would otherwise be read from their build-time path, which
# doesn't exist when a Windows build is cross-compiled from Linux (dev/win-run.sh).
[target.'cfg(windows)'.dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }


[package.metadata.deb]
maintainer = "jelly-gpui developers"
copyright = "jelly-gpui developers"
section = "video"
# Playback uses the system libmpv (in-app) and mpv (separate-window fallback). libmpv, Vulkan
# and Wayland are loaded at runtime, so `$auto` can't see them.
depends = "$auto, libmpv2, mpv, libvulkan1, libwayland-client0"
extended-description = "Desktop client for Jellyfin built with GPUI, playing media in mpv."
assets = [
    ["target/release/jelly-gpui", "usr/bin/", "755"],
    ["../../packaging/jelly-gpui.desktop", "usr/share/applications/", "644"],
    ["../../packaging/jelly-gpui.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
