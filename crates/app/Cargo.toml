[package]
name = "tabbyfin"
description = "Desktop Jellyfin client built with egui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jellyfin.workspace = true
player.workspace = true
eframe.workspace = true
egui.workspace = true
# The renderer under eframe: pages reach its device and texture registry (`RenderState`) for
# video.
egui-wgpu.workspace = true
egui_material_icons.workspace = true

anyhow.workspace = true
directories.workspace = true
gethostname.workspace = true
keyring.workspace = true
# The update check (`update.rs`).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sync`: `Task`'s result and the UI's update channels (`task.rs`).
tokio = { workspace = true, features = ["sync"] }
# `catch_unwind` on a `Task`'s future, so its panic reaches the UI thread.
futures-util.workspace = true
toml.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
# Server images (`images.rs`); the features are the formats Jellyfin serves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Placeholders for images still loading (`ImageBlurHashes`).
blurhash = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Whether a saved window spot still lands on a monitor, asked of the OS before the window opens,
# in physical pixels (`window.rs`). The same `windows` version as the player crate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's colour scheme, from the XDG portal (`theme.rs`): egui and winit report no system
# theme on Linux, and this is where `main` read it. `tokio`: the read and the signal watch are
# awaited on the app's runtime, never on the UI thread.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
winresource = "0.1.34"


[package.metadata.deb]
maintainer = "lgpy <lgpy17@gmail.com>"
copyright = "2026, lgpy <lgpy17@gmail.com>"
license-file = ["../../LICENSE", "0"]
section = "video"
# Playback uses the system libmpv. libmpv, Vulkan and Wayland are loaded at runtime, so
# `$auto` can't see them.
depends = "$auto, libmpv2, libvulkan1, libwayland-client0"
extended-description = "Desktop client for Jellyfin built with egui, playing media in mpv."
assets = [
    ["target/release/tabbyfin", "usr/bin/", "755"],
    ["../../packaging/tabbyfin.desktop", "usr/share/applications/", "644"],
    ["../../packaging/tabbyfin.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
