[package]
name = "tabbyfin"
description = "Desktop Jellyfin client built with GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jellyfin.workspace = true
player.workspace = true
gpui-kit.workspace = true

anyhow.workspace = true
directories.workspace = true
gethostname.workspace = true
keyring.workspace = true
# The update check (`update.rs`).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
# Video frames and server images (`images.rs`) are handed to GPUI as RenderImages; the
# features are the formats Jellyfin serves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
smallvec = "1"
# Placeholders for images still loading (`ImageBlurHashes`).
blurhash = { version = "0.2", default-features = false }

# Debug builds of gpui-kit's icons would otherwise be read from their build-time path, which
# doesn't exist when a Windows build is cross-compiled from Linux (dev/win-run.sh).
[target.'cfg(windows)'.dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }

[build-dependencies]
winresource = "0.1.34"


[package.metadata.deb]
maintainer = "lgpy <lgpy17@gmail.com>"
copyright = "2026, lgpy <lgpy17@gmail.com>"
license-file = ["../../LICENSE", "0"]
section = "video"
# Playback uses the system libmpv. libmpv, Vulkan and Wayland are loaded at runtime, so
# `$auto` can't see them.
depends = "$auto, libmpv2, libvulkan1, libwayland-client0"
extended-description = "Desktop client for Jellyfin built with GPUI, playing media in mpv."
assets = [
    ["target/release/tabbyfin", "usr/bin/", "755"],
    ["../../packaging/tabbyfin.desktop", "usr/share/applications/", "644"],
    ["../../packaging/tabbyfin.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
