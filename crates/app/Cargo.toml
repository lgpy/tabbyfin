[package]
name = "tabbyfin"
description = "Desktop Jellyfin client built with egui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jellyfin.workspace = true
player.workspace = true
eframe.workspace = true
egui.workspace = true
# The renderer under eframe: pages reach its device and texture registry (`RenderState`) for
# video.
egui-wgpu.workspace = true
egui_material_icons.workspace = true
# The mascot loader's concave outlines, tessellated into egui meshes (`widgets/mascot.rs`).
lyon_tessellation.workspace = true

anyhow.workspace = true
directories.workspace = true
gethostname.workspace = true
keyring.workspace = true
# The update check (`update.rs`).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sync`: `Task`'s result and the UI's update channels (`task.rs`).
tokio = { workspace = true, features = ["sync"] }
# `catch_unwind` on a `Task`'s future, so its panic reaches the UI thread.
futures-util.workspace = true
toml.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
# Server images (`images.rs`); the features are the formats Jellyfin serves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Placeholders for images still loading (`ImageBlurHashes`).
blurhash = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Whether a saved window spot still lands on a monitor, asked of the OS before the window opens,
# in physical pixels (`window.rs`), and opening the player's video textures on wgpu's D3D12
# device (`widgets/video/dx12.rs`). The `windows` version wgpu and the player crate use.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reading wgpu's Vulkan device UUID for the player (`widgets/video.rs`). The version wgpu uses.
ash = "0.38"
# The desktop's colour scheme, from the XDG portal (`theme.rs`): egui and winit report no system
# theme on Linux, and this is where `main` read it. `tokio`: the read and the signal watch are
# awaited on the app's runtime, never on the UI thread.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[features]
# Compiles a disposable mockup file into the UI tests (`src/ui_tests/mod.rs`).
mockup = []

[dev-dependencies]
# The UI tests (`src/ui_tests/`): egui driven headless through AccessKit, no GPU and no
# snapshots. `wiremock` serves the fixtures the pages read, as `crates/jellyfin/tests/http.rs`
# does.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
wiremock = "0.6.5"

[build-dependencies]
winresource = "0.1.34"


[package.metadata.deb]
maintainer = "lgpy <lgpy17@gmail.com>"
copyright = "2026, lgpy <lgpy17@gmail.com>"
license-file = ["../../LICENSE", "0"]
section = "video"
# Playback uses the system libmpv and wgpu the system Vulkan loader; winit loads xkbcommon,
# Wayland and the X11 libraries at runtime. `$auto` sees none of them because they're `dlopen`ed.
depends = "$auto, libmpv2, libvulkan1, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6"
extended-description = "Desktop client for Jellyfin built with egui, playing media in mpv."
assets = [
    ["target/release/tabbyfin", "usr/bin/", "755"],
    ["../../packaging/tabbyfin.desktop", "usr/share/applications/", "644"],
    ["../../packaging/tabbyfin.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # The bundled fonts' and icons' licenses, next to the generated copyright file.
    ["../../packaging/THIRD_PARTY.md", "usr/share/doc/tabbyfin/", "644"],
    ["../../packaging/licenses/Ubuntu-Font-Licence-1.0.txt", "usr/share/doc/tabbyfin/licenses/", "644"],
    ["../../packaging/licenses/Hack.txt", "usr/share/doc/tabbyfin/licenses/", "644"],
    ["../../packaging/licenses/emoji-icon-font.txt", "usr/share/doc/tabbyfin/licenses/", "644"],
    ["../../packaging/licenses/Material-Symbols.txt", "usr/share/doc/tabbyfin/licenses/", "644"],
    ["../../packaging/licenses/Apache-2.0.txt", "usr/share/doc/tabbyfin/licenses/", "644"],
]
