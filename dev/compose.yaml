# Local Jellyfin test server for development. See dev/README.md.
name: jelly-gpui-dev

services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    # Run as the host user so dev/.data stays deletable without sudo.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8096:8096"
    volumes:
      - ./.data/config:/config
      - ./.data/cache:/cache
      - ./.data/media:/media:ro
    restart: unless-stopped
